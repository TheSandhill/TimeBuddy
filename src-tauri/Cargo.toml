[package]
name = "timebuddy"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "timebuddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon`: close minimises to the tray and quitting lives in its menu
# (ADR-0004), so the icon is not optional decoration — it is the way out.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
rust_xlsxwriter = { version = "0.97.1", default-features = false, features = ["chrono"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.3.3"
# The lock screen's one primitive (ADR-0003). `std` brings `OsRng`, which is
# what salts a hash and what makes a "remember me" token unguessable.
argon2 = { version = "0.5", features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# An .xlsx is a zip of XML. The export tests open one and read the cells, so
# "the numbers are numbers" is checked rather than hoped for.
zip = { version = "8", default-features = false, features = ["deflate"] }

